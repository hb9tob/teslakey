; teslakey - configuration PlatformIO
;
; Ce dossier sert AUX DEUX chaines d'outils, sans duplication de code :
;
;   IDE Espressif / ligne de commande :  idf.py build flash monitor
;   PlatformIO                        :  pio run -e esp32dev -t upload
;
; PlatformIO utilise le framework espidf et reprend telle quelle la
; structure ESP-IDF : src_dir pointe sur main/ (qui contient deja son
; CMakeLists.txt), et components/teslakey est pris en compte
; automatiquement.
;
; ATTENTION A LA VERSION D'ESP-IDF
; Le code cible ESP-IDF v5.x. Le paquet "espressif32" officiel de
; PlatformIO est reste longtemps sur ESP-IDF 4.4, ou l'API NimBLE et
; mbedTLS differaient. Le code contient les adaptations necessaires
; (hal/common/tk_crypto_mbedtls.c et hal/esp32/tk_ble_nimble.c testent
; la version), mais le chemin 4.x n'a pas pu etre compile ici.
;
; Verifiez ce que vous avez :
;   pio run -e esp32dev -v 2>&1 | grep -i "esp-idf\|framework-espidf"
;
; Si c'est une 4.x et que la compilation coince, passez au fork
; communautaire pioarduino, qui suit les ESP-IDF 5.x : remplacez la
; ligne "platform" par l'URL de sa derniere release, listee sur
;   https://github.com/pioarduino/platform-espressif32/releases
; sous la forme
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/<version>/platform-espressif32.zip

[platformio]
src_dir = main
default_envs = esp32dev

[env]
framework = espidf
platform = espressif32
monitor_speed = 115200
; Laisse le moniteur decoder les adresses des traces de pile.
monitor_filters = esp32_exception_decoder, direct

; --- ESP32 classique (WROOM DevKit et assimiles) ---
[env:esp32dev]
board = esp32dev

; --- Heltec WiFi Kit 32 (ESP32 + ecran OLED) ---
[env:heltec_wifi_kit_32]
board = heltec_wifi_kit_32

; --- Heltec WiFi LoRa 32 V2 (ESP32) ---
[env:heltec_wifi_lora_32_V2]
board = heltec_wifi_lora_32_V2

; --- Heltec WiFi LoRa 32 V3 (ESP32-S3) ---
[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3

; --- ESP32-C3 : BLE 5.0, faible consommation ---
[env:esp32c3]
board = esp32-c3-devkitm-1
