# teslakey - nRF52840

# --- Bluetooth : role central uniquement ---
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_BROADCASTER=n
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1

# MTU. Le vehicule reste souvent a 23 : le decoupage en blocs de
# 20 octets est le cas courant, pas une exception.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_ATT_PREPARE_COUNT=2

# Pas d'appairage BLE : l'authentification est applicative (ECDH P-256).
CONFIG_BT_SMP=n

CONFIG_BT_DEVICE_NAME="teslakey"

# --- Cryptographie ---
# nrf_security adosse mbedTLS a CryptoCell (CC310) sur nRF52840 :
# P-256 et AES-GCM passent alors par le materiel.
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_GCM_C=y
CONFIG_MBEDTLS_AES_C=y
CONFIG_MBEDTLS_SHA256_C=y
# SHA-1 sert de derivation sur le secret ECDH (PROTOCOL.md section 2).
CONFIG_MBEDTLS_SHA1_C=y

# Alea a usage cryptographique : sys_csrand_get()
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CSPRNG_ENABLED=y

# --- Stockage persistant de la cle privee ---
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# --- Journal ---
CONFIG_LOG=y
CONFIG_TESLAKEY_LOG_LEVEL_INF=y

# --- Piles ---
# La multiplication scalaire P-256 en logiciel est gourmande en pile.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=4096
